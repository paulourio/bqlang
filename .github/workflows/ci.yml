name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Build CLI binaries
        run: go build ./cmd/...

      - name: Run race-enabled test suite
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

      - name: Verify formatting and lint configuration
        run: |
          golangci-lint config verify
          golangci-lint fmt --diff

  fuzz:
    name: Fuzz Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fuzz extensions extractor
        run: go test -run='^$' -fuzz='^FuzzExtractAll$' -fuzztime=5s ./extensions

      - name: Fuzz formatter print options
        run: go test -run='^$' -fuzz='^FuzzPrintOptions$' -fuzztime=5s ./formatter

      - name: Fuzz arbitrary SQL and Jinja2 inputs
        run: go test -run='^$' -fuzz='^FuzzFormatInput$' -fuzztime=5s ./formatter

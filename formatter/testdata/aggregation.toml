[setup]

[setup.print_options]
soft_max_cols = 80
newline_before_clause = true
align_logical_with_clauses = true
column_list_trailing_comma = "AUTO"
indentation = 2
min_joins_to_separate_in_blocks = 2
max_cols_for_single_line_select = 4
function_name_style = "UPPER_CASE"
identifier_style = "AS_IS"
keyword_style = "UPPER_CASE"
type_style = "UPPER_CASE"
bool_style = "UPPER_CASE"
null_style = "UPPER_CASE"
bytes_style = "AS_IS"
string_style = "AS_IS"

[[cases]]
input = """
select f1, f2 from T where f1=f2 group by f1
"""
formatted = """
SELECT f1, f2
  FROM T
 WHERE f1 = f2
 GROUP BY f1
"""

[[cases]]
input = """
select f1, f2 from T group by f1, f2, 1, 2
"""
formatted = """
SELECT f1, f2
  FROM T
 GROUP BY f1, f2, 1, 2
"""

[[cases]]
input = """
select f1 from T group by f1 having f1 < 5;
"""
formatted = """
SELECT f1
  FROM T
 GROUP BY f1
HAVING f1 < 5
"""

[[cases]]
input = """
select f1, sum(f2) from T group by f1 having f1 = 3 and sum(f2) > 5;
"""
formatted = """
SELECT f1, SUM(f2)
  FROM T
 GROUP BY f1
HAVING f1 = 3
   AND SUM(f2) > 5
"""


[setup]

[setup.print_options]
soft_max_cols = 80
newline_before_clause = true
align_logical_with_clauses = true
column_list_trailing_comma = "NEVER"
indentation = 2
min_joins_to_separate_in_blocks = 2
max_cols_for_single_line_select = 4
function_catalog = "BIGQUERY"
function_name_style = "AS_IS"
identifier_style = "AS_IS"
keyword_style = "UPPER_CASE"
type_style = "UPPER_CASE"
bool_style = "UPPER_CASE"
null_style = "UPPER_CASE"
bytes_style = "PREFER_SINGLE_QUOTE"
string_style = "PREFER_SINGLE_QUOTE"

[[cases]]
description = "Pipe query syntax starting with FROM"
input = """
from mydataset.orders
|> where status = "COMPLETE"
|> extend round(amount * 1.1, 2) as taxed_amount
|> aggregate count(*) as order_cnt, sum(taxed_amount) as total_amt group by customer_id
|> order by total_amt desc
|> limit 10;
"""
formatted = """
FROM mydataset.orders
|> WHERE status = 'COMPLETE'
|> EXTEND ROUND(amount * 1.1, 2) AS taxed_amount
|> AGGREGATE COUNT(*)          AS order_cnt,
             SUM(taxed_amount) AS total_amt GROUP BY customer_id
|> ORDER BY total_amt DESC
|> LIMIT 10
"""

[[cases]]
description = "Pipe operators SET, RENAME, DROP, DISTINCT, and JOIN"
input = """
select a, b, c from t1
|> set b = b + 1
|> rename c as c_new
|> drop b
|> distinct
|> left join t2 using (a);
"""
formatted = """
SELECT a, b, c
  FROM t1
|> SET b = b + 1
|> RENAME c AS c_new
|> DROP b
|> DISTINCT
|> LEFT JOIN t2 USING (a)
"""

[[cases]]
description = "Dot-chained function calls and inline WITH() expression"
input = """
select (raw_name).trim().lower() as clean_name,
       with(base as price * qty, tax as base * 0.08, round(base + tax, 2)) as total_val,
       (created_ts).timestamp_trunc(day) as created_dt
  from sales_fact
 group by all;
"""
formatted = """
SELECT (raw_name).TRIM().LOWER()                                           AS clean_name,
       WITH(base AS price * qty, tax AS base * 0.08, ROUND(base + tax, 2)) AS total_val,
       (created_ts).TIMESTAMP_TRUNC(DAY)                                   AS created_dt
  FROM sales_fact
 GROUP BY ALL
"""

[[cases]]
description = "HAVING and QUALIFY with OR and AlignLogicalWithClauses"
input = """
select user_id, count(*) as cnt
  from events
 group by user_id
having count(*) > 10 or sum(flag) = 1
qualify row_number() over (order by cnt desc) = 1 or user_id = 0;
"""
formatted = """
 SELECT user_id, COUNT(*) AS cnt
   FROM events
  GROUP BY user_id
 HAVING COUNT(*) > 10
     OR SUM(flag) = 1
QUALIFY ROW_NUMBER() OVER (ORDER BY cnt DESC) = 1
     OR user_id = 0
"""

[[cases]]
description = "DDL constraints, anonymous ANY TYPE UDF, Hints, and Date/Time literals"
input = """
create temp function identity_fn(any type) as (1);

create table mydataset.accounts (
  account_id int64 primary key not enforced,
  org_id int64,
  constraint fk_org foreign key (org_id) references mydataset.orgs(org_id) not enforced
);

select @{force_index=my_idx, join_method='hash'} timestamp'2026-01-01 00:00:00+00' as ts
  from mydataset.accounts;
"""
formatted = """
CREATE TEMPORARY FUNCTION identity_fn(ANY TYPE)
AS (
  1
);

CREATE TABLE mydataset.accounts
(
  account_id INT64 PRIMARY KEY NOT ENFORCED,
  org_id     INT64,
  CONSTRAINT fk_org FOREIGN KEY (org_id)
  REFERENCES mydataset.orgs(org_id) NOT ENFORCED
);

SELECT @{force_index=my_idx, join_method='hash'} TIMESTAMP '2026-01-01 00:00:00+00' AS ts
  FROM mydataset.accounts;
"""

[[cases]]
description = "Procedural loops, CASE statement, ASSERT, and RAISE"
input = """
begin
  declare i int64 default 0;
  assert i = 0 as "initial check";
  while i < 3 do
    set i = i + 1;
    if i = 2 then
      continue;
    end if;
  end while;
  for rec in (select 1 as v) do
    case rec.v
      when 1 then
        select rec.v;
      else
        raise using message = "unexpected";
    end case;
  end for;
exception when error then
  raise;
end;
"""
formatted = """
BEGIN
  DECLARE i INT64 DEFAULT 0;

  ASSERT i = 0 AS 'initial check';

  WHILE i < 3 DO
    SET i = i + 1;

    IF i = 2 THEN
      CONTINUE;
    END IF;
  END WHILE;

  FOR rec IN (
    SELECT 1 AS v
  ) DO
    CASE rec.v
      WHEN 1 THEN
        SELECT rec.v;
      ELSE
        RAISE USING MESSAGE = 'unexpected';
    END CASE;
  END FOR;
EXCEPTION WHEN ERROR THEN
  RAISE;
END
"""

[[cases]]
description = "EXPORT DATA, LOAD DATA, GRANT, REVOKE, and CREATE MODEL"
input = """
export data options(uri='gs://bucket/out/*.parquet', format='PARQUET') as
select id from mydataset.t;

load data into mydataset.t from files (format='PARQUET', uris=['gs://bucket/in/*.parquet']);

grant `roles/bigquery.dataViewer` on schema mydataset to 'user:alice@example.com';

revoke `roles/bigquery.dataViewer` on schema mydataset from 'user:alice@example.com';

create or replace model mydataset.churn_model
options(model_type='logistic_reg') as
select f1, label from mydataset.train_data;
"""
formatted = """
EXPORT DATA
OPTIONS (
  uri    = 'gs://bucket/out/*.parquet',
  format = 'PARQUET'
)
AS
SELECT id
  FROM mydataset.t;

LOAD DATA INTO mydataset.t
FROM FILES (
  format = 'PARQUET',
  uris   = ['gs://bucket/in/*.parquet']
);

GRANT `roles/bigquery.dataViewer` ON SCHEMA mydataset TO 'user:alice@example.com';

REVOKE `roles/bigquery.dataViewer` ON SCHEMA mydataset FROM 'user:alice@example.com';

CREATE OR REPLACE MODEL mydataset.churn_model
OPTIONS (model_type='logistic_reg')
AS
SELECT f1, label
  FROM mydataset.train_data;
"""

[[cases]]
description = "Pipe WITH operator with multiple CTEs"
input = """
select 1 as key
|> with t1 as (select 2 as key), t2 as (select 3 as key)
|> union all (from t1), (from t2);
"""
formatted = """
SELECT 1 AS key
|> WITH
  t1 AS (
  SELECT 2 AS key
  ),
  t2 AS (
  SELECT 3 AS key
  )
|> UNION ALL
  (
    FROM t1
  ),
  (
    FROM t2
  )
"""

[[cases]]
description = "Chained function calls on literals, unary expressions, and multi-part SAFE paths"
input = """
select (1).abs() as int_abs,
       (1.5).round(1) as flt_rnd,
       (-1).(safe.sqrt)() as neg_sqrt,
       (raw_json).(safe.parse_json)() as parsed_json,
       (date '2026-01-01').format_date('%Y') as yr,
       (' hello ').trim() as paren_str,
       ' world '.trim() as bare_str
  from input_fact;
"""
formatted = """
SELECT (1).ABS()                             AS int_abs,
       (1.5).ROUND(1)                        AS flt_rnd,
       (-1).(SAFE.SQRT)()                    AS neg_sqrt,
       (raw_json).(SAFE.PARSE_JSON)()        AS parsed_json,
       (DATE '2026-01-01').FORMAT_DATE('%Y') AS yr,
       (' hello ').TRIM()                    AS paren_str,
       ' world '.TRIM()                      AS bare_str
  FROM input_fact
"""

[[cases]]
description = "Generated, identity, default, and inline foreign-key columns with ALTER GENERATED"
input = """
create table mydataset.events (
  event_id int64 generated always as identity(start with 1 increment by 1),
  org_id int64 references mydataset.orgs(org_id) not enforced,
  status_cd string default 'NEW' not null,
  upper_cd string generated always as (upper(status_cd)) stored
);

alter table mydataset.events
  alter column if exists event_id set generated by default as identity(start with 100),
  alter column if exists event_id drop generated;
"""
formatted = """
CREATE TABLE mydataset.events
(
  event_id  INT64 GENERATED ALWAYS AS IDENTITY(START WITH 1 INCREMENT BY 1),
  org_id    INT64 REFERENCES mydataset.orgs(org_id) NOT ENFORCED,
  status_cd STRING DEFAULT 'NEW' NOT NULL,
  upper_cd  STRING GENERATED ALWAYS AS (UPPER(status_cd)) STORED
);

ALTER TABLE mydataset.events
  ALTER COLUMN IF EXISTS event_id
    SET GENERATED BY DEFAULT AS IDENTITY(START WITH 100),
  ALTER COLUMN IF EXISTS event_id
    DROP GENERATED;
"""

[[cases]]
description = "Search and vector index DDL (CREATE, STORING, ALL COLUMNS, ALTER REBUILD, DROP)"
input = """
create search index if not exists idx_logs
on mydataset.logs(all columns with column options (msg options(index_granularity='GLOBAL')))
options(analyzer='LOG_ANALYZER');

create or replace vector index idx_emb
on mydataset.docs(embedding)
storing(doc_id, title)
partition by doc_dt
options(index_type='IVF');

alter vector index if exists idx_emb on mydataset.docs rebuild;

drop vector index if exists idx_emb on mydataset.docs;
"""
formatted = """
CREATE SEARCH INDEX IF NOT EXISTS idx_logs
ON mydataset.logs(ALL COLUMNS WITH COLUMN OPTIONS (msg OPTIONS (index_granularity='GLOBAL')))
OPTIONS (analyzer='LOG_ANALYZER');

CREATE OR REPLACE VECTOR INDEX idx_emb
ON mydataset.docs(embedding)
STORING (doc_id, title)
PARTITION BY doc_dt
OPTIONS (index_type='IVF');

ALTER VECTOR INDEX IF EXISTS idx_emb ON mydataset.docs
  REBUILD;

DROP VECTOR INDEX IF EXISTS idx_emb ON mydataset.docs;
"""

[[cases]]
description = "External schema, connection, replica, entity, EXPORT MODEL, and LOAD DATA PARTITIONS"
input = """
create external schema if not exists ext_ds
with connection `proj.us.conn`
options(external_source='aws-glue://arn', location='aws-us-east-1');

create connection if not exists `proj.us.conn`
options(connection_type='CLOUD_RESOURCE');

alter schema if exists mydataset
  add replica eu_rep options(location='eu'),
  drop replica if exists old_rep;

create reservation `proj.region-us.prod`
options(slot_capacity=100);

export model mydataset.churn_model
options(uri='gs://bucket/model');

load data overwrite mydataset.part_tbl
overwrite partitions (_partitiondate = '2026-01-01')
from files (format='PARQUET', uris=['gs://bucket/p/*.parquet']);

insert into mydataset.part_tbl values (1, default);
"""
formatted = """
CREATE EXTERNAL SCHEMA IF NOT EXISTS ext_ds
WITH CONNECTION `proj.us.conn`
OPTIONS (
  external_source = 'aws-glue://arn',
  location        = 'aws-us-east-1'
);

CREATE CONNECTION IF NOT EXISTS `proj.us.conn`
OPTIONS (connection_type='CLOUD_RESOURCE');

ALTER SCHEMA IF EXISTS mydataset
  ADD REPLICA eu_rep OPTIONS (location='eu'),
  DROP REPLICA IF EXISTS old_rep;

CREATE RESERVATION `proj.region-us.prod`
OPTIONS (slot_capacity=100);

EXPORT MODEL mydataset.churn_model
OPTIONS (uri='gs://bucket/model');

LOAD DATA OVERWRITE mydataset.part_tbl
OVERWRITE PARTITIONS (_partitiondate = '2026-01-01')
FROM FILES (
  format = 'PARQUET',
  uris   = ['gs://bucket/p/*.parquet']
);

INSERT INTO mydataset.part_tbl
VALUES
  (1, DEFAULT);
"""

[[cases]]
description = "MATCH_RECOGNIZE in standard FROM clause and Pipe |> syntax"
input = """
select *
  from stock_ticks
       match_recognize (
         partition by symbol
         order by tick_ts
         measures
           match_number() as match_id,
           first(a.price) as start_price,
           last(b.price) as end_price,
           array_agg(classifier()) as symbols
         after match skip past last row
         pattern (^ a (b | c)+ d{2} e{1, 3}? f{,2} () $)
         define
           a as a.price > 100,
           b as b.price > prev(b.price) and b.price < next(b.price, 2),
           c as c.price >= a.price,
           d as d.volume > 0,
           e as e.price < 200,
           f as f.price > 0
         options (use_longest_match=true)
       ) as mr;

from stock_ticks
|> match_recognize (
  order by tick_ts
  measures
    array_agg(high.price) as high_agg,
    array_agg(low.price) as low_agg
  after match skip to next row
  pattern (low | high+)
  define
    low as low.price <= 100,
    high as high.price > 100
);
"""
formatted = """
SELECT *
  FROM stock_ticks
       MATCH_RECOGNIZE (
         PARTITION BY symbol
         ORDER BY tick_ts
         MEASURES
           MATCH_NUMBER()          AS match_id,
           FIRST(a.price)          AS start_price,
           LAST(b.price)           AS end_price,
           ARRAY_AGG(CLASSIFIER()) AS symbols
         AFTER MATCH SKIP PAST LAST ROW
         PATTERN (^ a (b | c)+ d{2} e{1, 3}? f{,2} () $)
         DEFINE
           a AS a.price > 100,
           b AS b.price > PREV(b.price) AND b.price < NEXT(b.price, 2),
           c AS c.price >= a.price,
           d AS d.volume > 0,
           e AS e.price < 200,
           f AS f.price > 0
         OPTIONS (use_longest_match=TRUE)
       ) AS mr;

FROM stock_ticks
|> MATCH_RECOGNIZE (
  ORDER BY tick_ts
  MEASURES
    ARRAY_AGG(high.price) AS high_agg,
    ARRAY_AGG(low.price)  AS low_agg
  AFTER MATCH SKIP TO NEXT ROW
  PATTERN (low | high+)
  DEFINE
    low  AS low.price <= 100,
    high AS high.price > 100
);
"""

[setup]

[setup.print_options]
soft_max_cols = 80
newline_before_clause = true
align_logical_with_clauses = true
column_list_trailing_comma = "AUTO"
indentation = 2
min_joins_to_separate_in_blocks = 2
function_name_style = "UPPER_CASE"
identifier_style = "AS_IS"
keyword_style = "UPPER_CASE"
type_style = "UPPER_CASE"
bool_style = "UPPER_CASE"
null_style = "UPPER_CASE"
bytes_style = "AS_IS"
string_style = "AS_IS"

[[cases]]
description = "Template comments"
input = """
select * {# comment #}
  from t
"""
formatted = """
SELECT *  {# comment #}
  FROM t
"""

[[cases]]
description = "7-byte Jinja2 comment does not collide with 7-space SELECT indentation"
input = """
{# x #}
select col_a, col_b from my_table
"""
formatted = """
{# x #}
SELECT col_a,
       col_b
  FROM my_table
"""

[[cases]]
description = "Short template variables shorter than internal placeholder"
input = """
select {{ a }}, {{ b }} from {{ t }} where x = {{ v }} -- keep comment
"""
formatted = """
SELECT {{ a }},
       {{ b }}
  FROM {{ t }}
 WHERE x = {{ v }}  -- keep comment
"""

[[cases]]
description = "Standalone set, standalone variable, and CTE for-loop"
input = """
{% set x = value -%}

{{ statement }}

with t as (
{% for a in list %}
  SELECT {{ a }}
  {% if not loop.last %} UNION ALL {% endif %}
{% endfor %}
)
select case when coalesce(a.key, 'abc') = b then '2' else '3' end
from {{ abc }}
"""
formatted = """
{% set x = value -%}

{{ statement }}

WITH
t AS (
{% for a in list %}
  SELECT {{ a }}
  {% if not loop.last %} UNION ALL {% endif %}
{% endfor %}
)
SELECT CASE
         WHEN COALESCE(a.key, 'abc') = b THEN '2'
                                         ELSE '3'
       END
  FROM {{ abc }};
"""

[[cases]]
description = "If / elif / else template blocks with SQL operators"
input = """
select id,
       {% if mode == 1 %} a % 2 {% elif mode == 2 %} b != 0 {% else %} c + 1 {% endif %} as val
  from {{ source('raw', 'events') }}
"""
formatted = """
SELECT id,
       {% if mode == 1 %} a % 2 {% elif mode == 2 %} b != 0 {% else %} c + 1 {% endif %} AS val
  FROM {{ source('raw', 'events') }}
"""

[[cases]]
description = "Mid-clause WHERE AND/OR blocks including dbt incremental subquery"
input = """
select {{- col -}}
from {{ ref('raw_events') }}
where 1 = 1
{% if is_incremental() %}
  AND updated_at > (SELECT MAX(updated_at) FROM {{ this }})
{% endif %}
{%- if include_deleted %} OR deleted_at IS NOT NULL {%- endif %}
"""
formatted = """
SELECT {{- col -}}
  FROM {{ ref('raw_events') }}
 WHERE     1 = 1
       {% if is_incremental() %}
  AND updated_at > (SELECT MAX(updated_at) FROM {{ this }})
{% endif %}
    {%- if include_deleted %} OR deleted_at IS NOT NULL {%- endif %}
"""

[[cases]]
description = "Mid-clause leading-comma and trailing-comma column blocks"
input = """
select {% if include_a %}a, {% endif %}id, name, email, status
       {% for col in extra_cols %}, {{ col }}{% endfor %}
  from {{ ref('users') }}
"""
formatted = """
SELECT {% if include_a %}a, {% endif %}
       id,
       name,
       email,
       status
       {% for col in extra_cols %}, {{ col }}{% endfor %}
  FROM {{ ref('users') }}
"""

[[cases]]
description = "Mid-clause conditional JOIN, WHERE, GROUP BY, HAVING, ORDER BY, and LIMIT"
input = """
select t.a, count(*) as cnt
from {{ ref('base') }} as t
{% if join_dim %} LEFT JOIN dim ON t.id = dim.id {% endif %}
{% if filter %} WHERE t.active = TRUE {% endif %}
{% if grp %} GROUP BY t.a {% endif %}
{% if hav %} HAVING count(*) > 1 {% endif %}
{% if ord %} ORDER BY cnt DESC {% endif %}
{% if dev %} LIMIT 100 {% endif %}
"""
formatted = """
SELECT t.a,
       COUNT(*) AS cnt
  FROM {{ ref('base') }} AS t
       {% if join_dim %} LEFT JOIN dim ON t.id = dim.id {% endif %}
 {% if filter %} WHERE t.active = TRUE {% endif %}
 {% if grp %} GROUP BY t.a {% endif %}
{% if hav %} HAVING count(*) > 1 {% endif %}
 {% if ord %} ORDER BY cnt DESC {% endif %}
 {% if dev %} LIMIT 100 {% endif %}
"""

[[cases]]
description = "Mid-clause conditional CASE WHEN, QUALIFY, UNION, and commented/empty-then branches"
input = """
select case {% if flag %} WHEN a = 1 THEN 'x' {% endif %} else 'y' end as label
from t1
where x=1{%- if extra %} {# keep active #} AND y = 2 {%- endif %}
{% if a %}{% else %} AND z = 3 {% endif %}
{% if qual %} QUALIFY ROW_NUMBER() OVER () = 1 {% endif %}
{% if more %} UNION ALL SELECT 'z' FROM t2 {% endif %}
"""
formatted = """
 SELECT CASE
          {% if flag %} WHEN a = 1 THEN 'x' {% endif %}
                                ELSE 'y'
        END AS label
   FROM t1
  WHERE x = 1
    {%- if extra %} {# keep active #} AND y = 2 {%- endif %}
    {% if a %}{% else %} AND z = 3 {% endif %}
{% if qual %} QUALIFY ROW_NUMBER() OVER () = 1 {% endif %}
  {% if more %} UNION ALL SELECT 'z' FROM t2 {% endif %}
"""
